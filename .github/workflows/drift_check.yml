name: drift-check

# Phase 4 (HSK-8 ack 738b412c, spec/ci-drift-check).
# Local-only header invariants check. Does NOT depend on CppTLM submodule
# or full PTX-EMU build chain — verifies the public device API surface
# stays within its frozen contract.

on:
  pull_request:
    branches: [main]
    paths:
      - 'include/ptxemu/**'
      - 'include/ptx_ir/**'
      - 'include/ptxsim/execution_types.h'
      # Phase 2.2/2.3 (device-api-delegation): Invariant 6 watches
      # src/ptxemu/device_api_impl.cc for stub regression (per Metis MR-3).
      - 'src/ptxemu/**'
      # antlr4-path-hardcoding-fix: Invariant 7 watches CMakeLists.txt for
      # vendored ANTLR4 path regressions (per cmake-antlr4-relative-paths).
      - 'CMakeLists.txt'
      # Phase 1.5k: Invariant 8 scans src/include/tests for bare IR tokens;
      # watch the scanned roots plus the scanner itself.
      - 'src/**'
      - 'tests/**'
      - 'scripts/check_ptxemu_ir_names.py'
  push:
    branches: [main]
    paths:
      - 'include/ptxemu/**'
      - 'include/ptx_ir/**'
      - 'include/ptxsim/execution_types.h'
      - 'src/ptxemu/**'
      # antlr4-path-hardcoding-fix: Invariant 7 watches CMakeLists.txt for
      # vendored ANTLR4 path regressions (per cmake-antlr4-relative-paths).
      - 'CMakeLists.txt'
      # Phase 1.5k: Invariant 8 scans src/include/tests for bare IR tokens;
      # watch the scanned roots plus the scanner itself.
      - 'src/**'
      - 'tests/**'
      - 'scripts/check_ptxemu_ir_names.py'
  workflow_dispatch:

# Cancel in-progress runs for same branch on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Invariant 1: PTXEMU_API_VERSION frozen at 1 (HSK-8 spec §Decision 3).
      # Bumping VERSION requires new HSK-N handshake, not in-PR change.
      - name: Check PTXEMU_API_VERSION == 1
        run: |
          if ! grep -qE "^#define[[:space:]]+PTXEMU_API_VERSION[[:space:]]+1\b" \
              include/ptxemu/device_api.h; then
            echo "::error file=include/ptxemu/device_api.h::PTXEMU_API_VERSION must remain 1; public signature changes require HSK-9 (bump VERSION in new spec)."
            exit 1
          fi

      # Invariant 2: IPtxEmuDevice virtual method count covers S1 facade 12
      # callsites (HSK-8 spec §CppTLM 端接受条件 隐含要求). Count methods
      # declared `= 0` (pure virtual) which are the IPtxEmuDevice
      # contract surface.
      - name: Check IPtxEmuDevice has >= 12 pure virtual methods
        run: |
          PURE_VIRTUAL_COUNT=$(grep -cE 'virtual[[:space:]]+[a-zA-Z_:&<>,* ]+[[:space:]]+[a-zA-Z_]+\([^)]*\)([[:space:]]+const)?[[:space:]]*=[[:space:]]*0' \
              include/ptxemu/device_api.h || true)
          if [ "$PURE_VIRTUAL_COUNT" -lt 12 ]; then
            echo "::error file=include/ptxemu/device_api.h::IPtxEmuDevice pure virtual method count ($PURE_VIRTUAL_COUNT) < 12 (S1 facade 12 callsites coverage)."
            exit 1
          fi

      # Invariant 3: device_api.h MUST NOT use C++20-only features
      # (HSK-8 spec §C++17 兼容 + spec/public-device-api §Requirement C++17).
      # Forbidden: std::format, requires, concept, <=>, consteval, constinit,
      # likely/unlikely attributes.
      # Filter comment lines first to avoid matching keywords mentioned
      # in documentation comments (e.g., "avoid std::format").
      - name: Check device_api.h C++17 compatibility
        run: |
          HITS=$(grep -vE '^[[:space:]]*(//|\*|/\*)' include/ptxemu/device_api.h \
                 | grep -nE 'std::format\b|requires[[:space:]]|concept\b|<=>|consteval\b|constinit\b|likely\]|unlikely\]' \
                 || true)
          if [ -n "$HITS" ]; then
            echo "::error file=include/ptxemu/device_api.h::detected C++20-only feature; HSK-8 spec §C++17 requires C++17-compatible header."
            echo "$HITS"
            exit 1
          fi

      # Invariant 4: public device_api.h MUST contain required HSK-8 contract
      # symbols (PTXEMU_API_VERSION macro, IPtxEmuDevice class, factory
      # functions create_device/destroy_device).
      - name: Check HSK-8 required symbols present
        run: |
          for SYMBOL in PTXEMU_API_VERSION IPtxEmuDevice create_device destroy_device; do
            if ! grep -q "\<$SYMBOL\>" include/ptxemu/device_api.h; then
              echo "::error file=include/ptxemu/device_api.h::required HSK-8 symbol '$SYMBOL' missing."
              exit 1
            fi
          done

      # Invariant 5: ptxemu_core CMake target name frozen (CppTLM consumer
      # references this exact target). Per design.md Decision 2.
      - name: Check ptxemu_core CMake target name frozen
        run: |
          if ! grep -qE 'add_library\(ptxemu_core[[:space:]]+STATIC' src/CMakeLists.txt; then
            echo "::error file=src/CMakeLists.txt::ptxemu_core STATIC library target renamed; HSK-8 spec §Decision 2 freezes target name for CppTLM consumer."
            exit 1
          fi

      # Invariant 6 (device-api-delegation + phase-2-2-1-3-1-followup,
      # per spec/ci-drift-check-extension):
      # device_api_impl.cc MUST NOT contain empty-body IPtxEmuDevice method
      # stubs (return false/-1/nullptr/etc with no real delegation logic).
      # Per phase-2-2-1-3-1-followup OpenSpec change: exemption list is
      # EMPTY (3 deferred stubs implemented as real delegations).
      - name: Check no empty-body IPtxEmuDevice method stubs (Invariant 6)
        run: |
          python3 - <<'PYEOF'
          import re
          import sys

          DEFERRED = set()
          IMPL = 'src/ptxemu/device_api_impl.cc'
          # Single constant return (matches spec/ci-drift-check-extension regex)
          CONST_RETURN = re.compile(
              r'^\s*return\s+(false|nullptr|-1|true|ThreadState::kIdle)\s*;?\s*$'
          )

          with open(IMPL) as f:
              content = f.read()

          # Match each override method: <name>(...) [const] override { <body> }
          # Capture only IPtxEmuDevice overrides (inside the impl class).
          pattern = re.compile(r'(\w+)\s*\([^)]*\)\s*(?:const\s*)?override\s*\{')
          errors = []
          pos = 0
          while True:
              m = pattern.search(content, pos)
              if not m:
                  break
              name = m.group(1)
              start = m.end() - 1  # position of '{'
              # Find matching closing brace
              depth, i = 0, start
              while i < len(content):
                  if content[i] == '{':
                      depth += 1
                  elif content[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  i += 1
              body = content[start+1:i]
              pos = i + 1

              if name in DEFERRED:
                  continue  # exempted per design Non-Goal 5

              # Strip comments + blank lines, check for single constant return
              lines = [
                  l.strip() for l in body.split('\n')
                  if l.strip() and not l.strip().startswith('//')
              ]
              if len(lines) == 1 and CONST_RETURN.match(lines[0]):
                  errors.append(f"{name}: empty-body stub (body: {lines[0]!r})")

          if errors:
              for e in errors:
                  print(f"::error file={IMPL}::{e} — per spec/ci-drift-check-extension Invariant 6, in-scope IPtxEmuDevice methods must have real delegation, not constant-return stubs.")
              sys.exit(1)
          PYEOF

      # Invariant 7 (antlr4-path-hardcoding-fix, per cmake-antlr4-relative-paths
      # spec): CMakeLists.txt MUST NOT use ${CMAKE_SOURCE_DIR} for vendored
      # ANTLR4 paths. CMAKE_SOURCE_DIR resolves to the top-level project root
      # and breaks CppTLM-side add_subdirectory/ExternalProject_Add consumers;
      # ${PROJECT_SOURCE_DIR} is project-relative and stable.
      - name: Check no CMAKE_SOURCE_DIR hardcoded ANTLR4 paths (Invariant 7)
        run: |
          if grep -nE "CMAKE_SOURCE_DIR.*antlr4|antlr4.*CMAKE_SOURCE_DIR" CMakeLists.txt; then
            echo "::error file=CMakeLists.txt::vendored ANTLR4 paths must use \${PROJECT_SOURCE_DIR} (project-relative), not \${CMAKE_SOURCE_DIR} (top-level-relative) — breaks CppTLM-side add_subdirectory consumers (per cmake-antlr4-relative-paths spec)."
            exit 1
          fi

      # Invariant 8 (phase-1-5-namespace-migration, per ptxemu-ir-namespace-contract
      # spec): no bare ptxemu::ir type tokens in src/include/tests callers. The
      # 1.5c+d forwarding shims (ptx_types.h / operand_context.h /
      # statement_context.h) and canonical include/ptxemu/ir/ definitions stay
      # exempt; everything else must reference IR types ptxemu::ir::-qualified.
      - name: Check no bare ptxemu::ir type tokens (Invariant 8)
        run: |
          if ! python3 scripts/check_ptxemu_ir_names.py \
              --roots src include tests \
              --exclude include/ptx_ir/ptx_types.h \
              --exclude include/ptx_ir/operand_context.h \
              --exclude include/ptx_ir/statement_context.h \
              --exclude include/ptxemu/ir; then
            echo "::error::bare ptxemu::ir type tokens found in src/include/tests callers — qualify them with ptxemu::ir:: (per ptxemu-ir-namespace-contract spec)."
            exit 1
          fi