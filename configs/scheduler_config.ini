# Scheduler Configuration
# PTX-EMU SIMT Warp Scheduler Parameters
# 
# This file configures the priority-based anti-starvation warp scheduler.
# Higher priority values = more likely to be scheduled
#
# Reference: GPGPU-Sim warp scheduler models
# Last Updated: 2026-04-02

[scheduler]
# Base priority weights for different warp states
# These values determine scheduling preference

# Priority boost for warps waiting on memory operations
# Prevents memory-bound warps from being starved by compute-bound warps
priority.memory_wait = 100

# Default priority for warps with no dependencies (ready to execute)
priority.no_dependency = 50

# Priority boost for warps waiting at barriers
# Critical for spinlock scenarios - ensures barrier participants make progress
priority.barrier_waiting = 25

# Scale factor for wait cycle counter
# Each cycle a warp is not scheduled increases its priority by this amount
# Prevents starvation by gradually boosting priority of waiting warps
priority.wait_cycle_scale = 1

# Maximum accumulated priority bonus from wait cycles
# Caps the anti-starvation boost to prevent a single warp from monopolizing
priority.max_wait_bonus = 200

# Scheduler algorithm selection
# Options: round_robin, priority, gto (greedy_then_oldest), lrr (least_recently_run)
algorithm = priority

# Enable anti-starvation mechanism
# If false, uses pure priority scheduling without wait cycle boost
anti_starvation_enabled = true

# Time slice (in cycles) before forced warp switch
# Set to 0 for no time slicing (run until blocked)
time_slice_cycles = 0

# Minimum number of warps to keep active
# Ensures warp-level parallelism is maintained
min_active_warps = 2


[barrier_aware]
# Barrier-aware scheduler settings
# These parameters optimize scheduling when barriers are present

# When true, scheduler checks barrier status before selecting warps
# Prevents scheduling warps that are waiting at unsatisfiable barriers
enabled = true

# Priority boost for warps at barriers with all participants blocked
# Helps unblock barrier synchronization
full_barrier_boost = 50

# Check interval (in cycles) for barrier status
# Lower values = more responsive barrier handling, higher overhead
check_interval_cycles = 1


[memory]
# Memory scheduler integration settings

# Number of outstanding memory requests per warp
# Limits memory-level parallelism to prevent memory saturation
max_outstanding_requests = 8

# Latency for global memory access (in cycles)
# Used for scheduling predictions
global_mem_latency = 400

# Latency for shared memory access (in cycles)
shared_mem_latency = 1


[debug]
# Debug and logging options

# Enable verbose scheduler logging
verbose = false

# Log warp scheduling decisions
log_scheduling = false

# Print priority values for each scheduling decision
log_priorities = false

# Cycle counter for periodic status reports
report_interval = 1000
