# PTX-EMU 开发调试配置文件
# 特点：平衡的日志级别，适合日常开发和调试

[logger]
# 全局日志级别：debug 级别，显示调试信息
global_level=debug

# 日志输出目标：控制台 + 文件
target=both
logfile=ptx_emu_debug.log
async=false

# 日志格式：显示关键信息
colorize=true
show_timestamp=true
show_level=true
show_component=true
show_location=false
show_thread_id=true

# 组件日志级别：关键组件使用 debug，其他使用 info
component.emu=debug
component.exec=debug
component.mem=info
component.reg=info
component.thread=debug
component.func=debug
component.instr=info

[debugger]
# 启用基本指令跟踪
trace_instruction=true
trace_instruction_type.memory=true
trace_instruction_type.arithmetic=true
trace_instruction_type.control=true
trace_instruction_type.logic=false
trace_instruction_type.convert=false
trace_instruction_type.special=false
trace_instruction_type.other=false

# 启用关键跟踪
trace_registers=true
trace_memory=true
trace_warp=false
trace_instruction_status=true
trace_lanes=0x1
trace_simt_stack=false
trace_cycle=false
trace_divergence=false
trace_convergence=false

[gpu]
# 使用最小 GPU 配置
gpu_config_file=mini.json
