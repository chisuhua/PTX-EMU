# PTX-EMU 内存调试配置文件
# 特点：专注于内存操作跟踪，适合调试内存相关问题

[logger]
# 全局日志级别：debug
global_level=debug

# 日志输出目标：控制台 + 文件
target=both
logfile=ptx_emu_memory_debug.log
async=false

# 日志格式
colorize=true
show_timestamp=true
show_level=true
show_component=true
show_location=true
show_thread_id=true

# 组件日志级别：内存相关使用 trace，其他使用 info
component.emu=info
component.exec=info
component.mem=trace
component.reg=debug
component.thread=debug
component.func=info
component.instr=info

[debugger]
# 只跟踪内存指令
trace_instruction=true
trace_instruction_type.memory=true
trace_instruction_type.arithmetic=false
trace_instruction_type.control=false
trace_instruction_type.logic=false
trace_instruction_type.convert=false
trace_instruction_type.special=false
trace_instruction_type.other=false

# 启用内存和寄存器跟踪
trace_registers=true
trace_memory=true
trace_warp=false
trace_instruction_status=true
trace_lanes=0x1
trace_simt_stack=false
trace_cycle=false
trace_divergence=false

[gpu]
# 使用最小 GPU 配置
gpu_config_file=mini.json
