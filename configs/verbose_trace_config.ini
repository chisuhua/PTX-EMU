# PTX-EMU 详细跟踪配置文件
# 特点：最高详细级别，适合深入分析问题和理解执行流程
# 注意：会产生大量日志输出，仅用于详细调试

[logger]
# 全局日志级别：trace 级别，显示所有信息
global_level=trace

# 日志输出目标：文件（避免控制台输出过慢）
target=file
logfile=ptx_emu_trace.log
async=false

# 日志格式：显示所有信息
colorize=true
show_timestamp=true
show_level=true
show_component=true
show_location=true
show_thread_id=true

# 组件日志级别：全部使用 trace
component.emu=trace
component.exec=trace
component.mem=trace
component.reg=trace
component.thread=trace
component.func=trace
component.instr=trace

[debugger]
# 启用所有指令跟踪
trace_instruction=true
trace_instruction_type.memory=true
trace_instruction_type.arithmetic=true
trace_instruction_type.control=true
trace_instruction_type.logic=true
trace_instruction_type.convert=true
trace_instruction_type.special=true
trace_instruction_type.other=true

# 启用所有跟踪
trace_registers=true
trace_memory=true
trace_warp=true
trace_instruction_status=true
trace_lanes=0xFFFFFFFF
trace_simt_stack=false
trace_cycle=false
trace_divergence=false

[gpu]
# 使用最小 GPU 配置（减少复杂度）
gpu_config_file=mini.json
