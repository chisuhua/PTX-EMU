# PTX-EMU 生产环境配置文件
# 特点：最小日志输出，最佳性能，适合正常运行程序

[logger]
# 全局日志级别：只记录重要信息
global_level=info

# 日志输出目标：仅控制台
target=console

# 日志文件格式
colorize=true
show_timestamp=true
show_level=true
show_component=false
show_location=false
show_thread_id=false

# 组件日志级别：全部使用 info 级别
component.emu=info
component.exec=info
component.mem=info
component.reg=info
component.thread=info
component.func=info
component.instr=info

[debugger]
# 禁用详细指令跟踪
trace_instruction=false
trace_instruction_type.memory=false
trace_instruction_type.arithmetic=false
trace_instruction_type.control=false
trace_instruction_type.logic=false
trace_instruction_type.convert=false
trace_instruction_type.special=false
trace_instruction_type.other=false

# 禁用详细跟踪
trace_registers=false
trace_memory=false
trace_warp=false
trace_instruction_status=false
trace_lanes=0x1
trace_simt_stack=false
trace_cycle=false
trace_divergence=false
trace_convergence=false

[gpu]
# 使用最小 GPU 配置（快速测试）
gpu_config_file=mini.json

[ptxir]
mode = off
