# PTX-EMU 指令调试配置文件
# 特点：专注于单条指令执行跟踪，适合调试特定指令问题

[logger]
# 全局日志级别：trace（仅指令组件）
global_level=info

# 日志输出目标：控制台 + 文件
target=both
logfile=ptx_emu_instr_debug.log
async=false

# 日志格式
colorize=true
show_timestamp=true
show_level=true
show_component=true
show_location=true
show_thread_id=true

# 组件日志级别：指令执行使用 trace，其他使用 warning
component.emu=warning
component.exec=trace
component.mem=warning
component.reg=trace
component.thread=info
component.func=warning
component.instr=trace

[debugger]
# 启用所有指令跟踪
trace_instruction=true
trace_instruction_type.memory=true
trace_instruction_type.arithmetic=true
trace_instruction_type.control=true
trace_instruction_type.logic=true
trace_instruction_type.convert=true
trace_instruction_type.special=true
trace_instruction_type.other=true

# 只跟踪单个 lane（简化输出）
trace_registers=true
trace_memory=true
trace_warp=false
trace_instruction_status=true
trace_lanes=0x1
trace_simt_stack=false
trace_cycle=false
trace_divergence=false

[gpu]
# 使用最小 GPU 配置
gpu_config_file=mini.json
