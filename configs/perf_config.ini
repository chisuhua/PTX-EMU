# PTX-EMU 性能分析配置文件
# 特点：最小化日志开销，启用性能统计

[logger]
# 全局日志级别：warning（只记录警告和错误）
global_level=warning

# 日志输出目标：控制台
target=console

# 日志格式：简洁
colorize=true
show_timestamp=false
show_level=true
show_component=false
show_location=false
show_thread_id=false

# 组件日志级别：全部 warning
component.emu=warning
component.exec=warning
component.mem=warning
component.reg=warning
component.thread=warning
component.func=warning
component.instr=warning

[debugger]
# 禁用所有详细跟踪（减少性能开销）
trace_instruction=false
trace_instruction_type.memory=false
trace_instruction_type.arithmetic=false
trace_instruction_type.control=false
trace_instruction_type.logic=false
trace_instruction_type.convert=false
trace_instruction_type.special=false
trace_instruction_type.other=false

trace_registers=false
trace_memory=false
trace_warp=false
trace_instruction_status=false
trace_lanes=0x1

[gpu]
# 使用完整 GPU 配置（如果需要性能分析）
# gpu_config_file=ampere_a100.json
gpu_config_file=mini.json
